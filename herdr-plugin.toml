id = "rhinoc.herdr-workbench"
name = "Quickpad"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Notes and shell commands in a Herdr popup."
platforms = ["macos", "linux"]

[[build]]
command = ["npm", "ci"]

[[startup]]
command = ["node", "index.js", "daemon"]

[[actions]]
id = "toggle"
title = "Toggle Quickpad"
description = "Open or close the temporary notes and terminal workspace"
contexts = ["global"]
command = ["node", "index.js", "toggle"]

[[panes]]
id = "workbench"
title = "Quickpad"
description = "Notes and shell commands in a temporary popup"
placement = "popup"
width = "60%"
height = "55%"
command = ["node", "index.js", "ui"]
